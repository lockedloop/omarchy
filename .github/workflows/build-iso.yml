  name: Build ISO

  on:
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      container:
        image: archlinux:latest
        options: --privileged

      steps:
        - name: Install dependencies
          run: pacman -Syu --noconfirm git archiso

        - name: Clone ISO builder
          run: |
            git clone https://github.com/omacom-io/omarchy-iso.git
            cd omarchy-iso
            git submodule update --init

        - name: Build ISO
          run: |
            cd omarchy-iso
            OMARCHY_INSTALLER_REPO="lockedloop/omarchy" OMARCHY_INSTALLER_REF="dev" ./bin/omarchy-iso-make

        - name: Upload ISO
          uses: actions/upload-artifact@v4
          with:
            name: omarchy-iso
            path: omarchy-iso/release/*.iso


